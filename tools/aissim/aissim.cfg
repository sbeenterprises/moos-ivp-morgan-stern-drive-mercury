//---------------------------------------------------------------------------
// aissim.cfg - external NMEA0183 vessel and AIS traffic simulator
//
//   ./bin/aissim tools/aissim/aissim.cfg
//
// Pair this with missions/s1_morgan_city_signalk/external.moos. Start the
// mission first (so iWebSocket is listening), then aissim.
//
// Data flow:
//   aissim --UDP 10112--> Signal K --plugin--> UDP 10111 --> iDivisorNMEA
//   iWebSocket ws://:8000 --DESIRED_RUDDER/THRUST--> aissim
//---------------------------------------------------------------------------

// ---- where the sentences go -----------------------------------------------
// The Signal K server's NMEA0183 UDP provider (~/.signalk/settings.json).
nmea_host = 127.0.0.1
nmea_port = 10112

// ---- where the actuator demand comes from ---------------------------------
// iWebSocket's WebSocket server. Turn this off and the USV moves open loop:
// the helm computes a solution and nothing acts on it.
control_url     = ws://127.0.0.1:8000
control_enabled = true

// ---- geodesy --------------------------------------------------------------
// MUST match LatOrigin / LongOrigin in the .moos file, or MOOS and the chart
// will disagree about where everything is. Morgan City:
origin_lat = 29.71970895316288
origin_lon = -91.14705165281887

// ---- ownship --------------------------------------------------------------
// This MMSI must match iDivisorNMEA's ownship_mmsi, or the USV becomes a
// contact of its own and starts avoiding itself.
ownship_mmsi = 710400014
ownship_name = SWIFTSHIPS_USV
// Transmit ownship as an AIS target too. Off by default: Signal K already
// knows where "self" is from the $GPRMC above.
ownship_ais  = false

// Hull model, same numbers as uSimMarineV22 in simulated.moos.
start_x       = -6289
start_y       = 400
start_heading = 0
start_speed   = 0
turn_rate     = 95
turn_spd_loss = 0.4
thrust_map    = 0:0, 20:3, 40:6, 60:9, 80:12, 100:15
depth         = 12.0

nav_interval  = 0.25    // seconds between ownship sentences (4 Hz)
tick          = 0.05    // simulation step

// ---- AIS traffic ----------------------------------------------------------
// Clearly fake MMSI block. Contacts get mmsi_base+1, +2, ...
mmsi_base         = 366999000
position_interval = 1     // AIS msg 1 per contact, seconds
static_interval   = 30    // AIS msg 5 per contact, seconds

// (a) scripted contacts - deterministic, repeatable.
// Underscores in names become spaces. x/y are absolute local grid metres.
contact = name=TUG_ALPHA, type=tug, x=-6000, y=600, hdg=270, spd=4, length=25, beam=9
contact = name=FERRY_BRAVO, type=ferry, x=-6800, y=1000, hdg=90, spd=8, length=60, beam=14

// (b) random traffic around the USV, respawned on the circle edge when it
//     wanders out.
random_contacts = 6
random_radius   = 1500
random_spd_min  = 2
random_spd_max  = 9

// (c) closed-loop patrol - a predictable target to run collision avoidance
//     against, since it comes back around.
loop = name=WORKBOAT_ECHO, type=cargo, spd=5, pts=-6000,200:-5600,200:-5600,800:-6000,800
